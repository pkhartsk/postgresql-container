on:
  issue_comment:
    types:
      - created
jobs:
  distgen-check:
    uses: "pkhartsk/.github/.github/workflows/distgen-check.yml@main"
  container-tests:
    needs: distgen-check
    uses: "pkhartsk/.github/.github/workflows/container-tests.yml@main"
    with:
      enabled-tests: '["container","openshift-4","openshift-pytest"]'
      versions: '["12", "13", "15", "16"]'
      openshift-versions: '["12", "13", "15", "16"]'
    secrets: inherit
